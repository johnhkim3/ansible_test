---
- name: Remove tmux
  hosts: lab1
  become: true
  tasks:
    - name: Ensure tmux is uninstalled
      ansible.builtin.package:
        name: tmux
        state: absent

- name: Remove httpd and firewall rule on RHEL 10
  hosts: lab2
  become: true

  tasks:
    - name: Stop and disable httpd service
      ansible.builtin.systemd:
        name: httpd
        state: stopped
        enabled: false

    - name: Remove http service from the firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: disabled
        immediate: true

    - name: Uninstall httpd package
      ansible.builtin.dnf:
        name: httpd
        state: absent


